name: Publish to PyPI

# Triggers when a version tag (v0.2.2, v1.0.0, …) is pushed.
# The build and validation steps run on every tag, but the upload step
# uses PyPI's OIDC trusted publishing — no API tokens required, the
# token is minted just-in-time by GitHub and consumed by PyPI.
#
# One-time PyPI setup (https://pypi.org/manage/account/publishing/):
#   PyPI Project Name : inferall
#   Owner             : GravenSm
#   Repository name   : inferall
#   Workflow name     : publish.yml
#   Environment name  : pypi
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag matches pyproject version
        # Defensive check: prevents accidentally publishing v0.3.0 when
        # pyproject still says 0.2.1. The two MUST match or the upload
        # will be rejected by PyPI for the wrong reasons.
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          echo "Tag version:     $TAG"
          echo "Project version: $PROJECT_VERSION"
          if [ "$TAG" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag version ($TAG) does not match pyproject version ($PROJECT_VERSION)"
            exit 1
          fi

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        # twine check runs the same metadata + README rendering checks
        # PyPI runs on upload. Fails the build before we get to the
        # publish step if anything is malformed.
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The 'pypi' environment matches the one configured on PyPI's
    # trusted publishing page. Adding it as an environment also gives
    # you a "Review deployments" gate in GitHub if you ever want to
    # require manual approval before a release goes live.
    environment:
      name: pypi
      url: https://pypi.org/p/inferall
    permissions:
      # Required for OIDC trusted publishing — mints the short-lived
      # token GitHub hands to PyPI in place of an API token.
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
