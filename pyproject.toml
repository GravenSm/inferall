[build-system]
# setuptools >= 77 is required for the PEP 639 SPDX license expression below.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferall"
version = "0.2.6"
description = "Universal inference engine for every AI model — chat, embeddings, vision, ASR, diffusion, TTS, with optional vLLM acceleration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "GravenSm", email = "GravenSm@users.noreply.github.com"},
]
keywords = [
    "inference",
    "llm",
    "openai-compatible",
    "huggingface",
    "vllm",
    "transformers",
    "gguf",
    "embeddings",
    "vision-language",
    "whisper",
    "diffusion",
    "self-hosted",
    "ai-server",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "accelerate>=0.25",
    "huggingface-hub>=0.20",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    # sse-starlette is imported unconditionally at api/server.py module
    # load time for the streaming chat completion endpoint, so it must
    # be a core dependency — `inferall serve` cannot start without it.
    "sse-starlette>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "nvidia-ml-py>=11.5",
    "python-multipart>=0.0.6",
    "textual>=0.40",
]

[project.optional-dependencies]
gguf = ["llama-cpp-python>=0.2"]
gptq = ["auto-gptq>=0.6"]
awq = ["autoawq>=0.1"]
bnb = ["bitsandbytes>=0.41"]
embeddings = ["sentence-transformers>=2.2"]
diffusion = ["diffusers>=0.25", "Pillow>=10.0"]
asr = ["soundfile>=0.12", "librosa>=0.10"]
tts = ["scipy>=1.10"]
multimodal = ["inferall[asr,diffusion,embeddings,tts]"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "httpx>=0.25"]
all = ["inferall[gguf,gptq,awq,bnb,multimodal,dev]"]

[project.scripts]
inferall = "inferall.cli.app:main"
inferall_dashboard = "inferall.tui.__main__:main"

[project.urls]
Homepage = "https://inferall.dev"
Repository = "https://github.com/GravenSm/inferall"
Issues = "https://github.com/GravenSm/inferall/issues"
Changelog = "https://github.com/GravenSm/inferall/releases"

[tool.setuptools.packages.find]
include = ["inferall*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
