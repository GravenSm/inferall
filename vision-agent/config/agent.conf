# Vision Agent Configuration

# Frame capture
fps = 2
src_width = 640
src_height = 480

# Preprocessed output resolution
frame_width = 64
frame_height = 48

# Occupancy grid
cell_size_m = 0.05
grid_x = 16
grid_y = 16
grid_z = 8
decay_per_frame = 5

# FSM thresholds
obstacle_close_mm = 30
obstacle_clear_mm = 50
emergency_stop_mm = 10
target_lost_timeout_ms = 2000

# Motor
cruise_speed = 400
avoid_turn_rate = 600

# Camera intrinsics (RealSense D435 defaults at 640x480)
fx = 386.0
fy = 386.0
cx = 320.0
cy = 240.0

# IPC
shm_name = /vision_agent
